[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noshow-iq-65645"
version = "0.1.0"
description = "Predict patient no-shows for clinic appointments"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "M. Usman Bin Younas" }]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "pymongo>=4.8",
  "python-dotenv>=1.0",
  "pydantic>=2.9",
]

[project.urls]
Homepage = "https://github.com/musmanbinyounas-boop/noshow-iq-65645"
Repository = "https://github.com/musmanbinyounas-boop/noshow-iq-65645"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["noshow_iq"]