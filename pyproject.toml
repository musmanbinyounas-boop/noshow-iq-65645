[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noshow-iq-65645"
version = "0.1.0"
description = "Predict patient no-shows for clinic appointments"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "M. Usman Bin Younas" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "pymongo>=4.8",
  "python-dotenv>=1.0",
  "pydantic>=2.9",
]

[project.urls]
Homepage = "https://github.com/musmanbinyounas-boop/noshow-iq-65645"

[tool.hatch.build.targets.wheel]
packages = ["noshow_iq"]