services:
  app:
    build: .
    image: noshowiq:dev
    container_name: noshowiq_app
    environment:
      MONGO_URI: mongodb://mongo:27017/noshowiq
      MODEL_PATH: /app/models/model.pkl
    ports:
      - "7860:7860"
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: noshowiq_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    container_name: noshowiq_mongo_express
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "8081:8081"
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data:
  